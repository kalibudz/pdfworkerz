# Token-free review workers: deterministic tooling only, no AI services.
name: ci

# Manual-only: Actions minutes are billed on this private repo. tools/gate.py runs these same checks locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check engine cli tools tests server

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: mypy engine cli tools server

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e ".[dev]"
      - name: Build the web UI (tests/web/ drives this build, not a dev server)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install the Chromium build tests/web/ drives
        run: playwright install --with-deps chromium
      - name: Test suite with evidence collection and coverage gate
        run: pytest --feature-results --cov --cov-report=term-missing
      - name: Evidence gate (no "done" without passing tests)
        run: python tools/update_tracker.py --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: bandit -q -r engine cli tools server
      - run: pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit web/ dependencies (it parses untrusted, possibly malicious PDFs -- SPEC.md §5.3's own threat model)
        working-directory: web
        run: |
          npm ci
          npm audit

  spec-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/gen_spec_catalog.py --check
      - run: pip install -e .
      - run: python tools/gen_ops_schema.py --check

  tracker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tracker/package-lock.json
      - run: npm ci
      - run: npm run build

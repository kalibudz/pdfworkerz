[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "engine.ops", "cli"]

[project]
name = "pdfworkerz"
version = "0.0.1"
description = "Free, offline, token-free PDF editing worker with style-faithful text editing"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
  "pymupdf==1.28.2",
  "pikepdf==10.14.0",
  "fonttools==4.66.0",
  "pydantic==2.13.5",
  "typer==0.27.2",
  "numpy==2.5.3",
]

[project.scripts]
pdfworkerz = "cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pyyaml>=6",
  "types-PyYAML",
  "reportlab==5.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "."]
addopts = "-ra --strict-markers"
markers = ["feature(id, criterion=1): the feature this test proves"]

[tool.coverage.run]
source = ["tools", "engine", "cli"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["features", "gen_spec_catalog", "session_budget", "update_tracker"]

[tool.mypy]
strict = true
mypy_path = "tools"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fitz.*", "pymupdf.*", "pikepdf.*", "fontTools.*", "reportlab.*"]
ignore_missing_imports = true

# pymupdf and pikepdf ship partial, inconsistent type stubs (some methods carry
# real signatures, many others are `(*args, **kwargs)` or missing constants
# entirely -- verified against the installed versions, see engine/document.py).
# Every call into them is checked for its *behavior* by tests/engine, so relaxing
# these two strict sub-checks only for the modules that touch those libraries
# directly is a deliberate, scoped trade-off, not a general weakening of strict mode.
[[tool.mypy.overrides]]
module = ["engine.*", "cli.*"]
disallow_untyped_calls = false
warn_return_any = false
